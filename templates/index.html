<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASHA Sahayak</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c2b25;--paper:#f6f7f2;--line:#d5dbd0;--g:#2f7d4f;--y:#d99a0b;--r:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.5 "Atkinson Hyperlegible","Noto Sans Devanagari",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;margin:4px 0 2px}
.sub{color:#51635a;margin:0 0 18px}
.row{display:flex;gap:10px;margin-bottom:12px}
select,input,textarea{font:inherit;padding:12px;border:2px solid var(--line);border-radius:10px;background:#fff;width:100%}
textarea{min-height:110px;resize:vertical}
#mic{width:100%;padding:22px;font:700 20px inherit;font-family:inherit;border:0;border-radius:14px;background:var(--ink);color:#fff;cursor:pointer}
#mic.on{background:var(--r)}
#go{width:100%;margin-top:12px;padding:16px;font:700 19px inherit;font-family:inherit;border:2px solid var(--ink);border-radius:14px;background:#fff;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #1a73e8;outline-offset:2px}
#out{margin-top:22px;display:none;border-radius:14px;border:3px solid;padding:18px;background:#fff}
#out.red{border-color:var(--r)}#out.yellow{border-color:var(--y)}#out.green{border-color:var(--g)}
#lvl{font-size:24px;font-weight:700;margin:0 0 8px}
.red #lvl{color:var(--r)}.yellow #lvl{color:#9a6b00}.green #lvl{color:var(--g)}
.adv{padding:10px 0;border-top:1px solid var(--line)}
.note{font-size:14px;color:#51635a;margin-top:14px}
#stats{margin-top:28px;font-size:16px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:6px 0}
a.btn{display:inline-block;margin-top:12px;padding:12px 16px;border-radius:10px;background:var(--ink);color:#fff;text-decoration:none}
</style></head><body><main>
<h1 id="t">ASHA Sahayak</h1>
<p class="sub" id="s">Speak the symptoms. Get a triage and referral note.</p>
<div class="row">
  <select id="lang"><option value="mr">मराठी</option><option value="hi">हिन्दी</option><option value="en">English</option></select>
</div>
<div class="row"><input id="age" inputmode="numeric" placeholder="Age"><input id="days" inputmode="numeric" placeholder="Days sick"><input id="village" placeholder="Village"></div>
<button id="mic">🎤 Tap and speak</button>
<textarea id="text" placeholder="Symptoms appear here. You can also type." style="margin-top:12px"></textarea>
<button id="go">Check patient</button>
<section id="out" aria-live="polite"><p id="lvl"></p><div id="flags"></div><p id="sum"></p><a class="btn" id="ref" target="_blank">Open referral note</a>
<p class="note">Decision support for trained health workers. Not a diagnosis. When in doubt, refer.</p></section>
<section id="stats"></section>
</main>
<script>
const $=id=>document.getElementById(id);
const locale={mr:"mr-IN",hi:"hi-IN",en:"en-IN"};
let rec,listening=false;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$("mic").onclick=()=>{
  if(!SR){alert("Voice input needs Chrome. Type the symptoms instead.");return}
  if(listening){rec.stop();return}
  rec=new SR();rec.lang=locale[$("lang").value];rec.interimResults=true;rec.continuous=true;
  rec.onresult=e=>{$("text").value=[...e.results].map(r=>r[0].transcript).join(" ")};
  rec.onstart=()=>{listening=true;$("mic").classList.add("on");$("mic").textContent="⏹ Listening… tap to stop"};
  rec.onend=()=>{listening=false;$("mic").classList.remove("on");$("mic").textContent="🎤 Tap and speak"};
  rec.start();
};
$("go").onclick=async()=>{
  const r=await fetch("/api/triage",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({text:$("text").value,lang:$("lang").value,age:$("age").value,days:$("days").value,village:$("village").value})});
  const d=await r.json();
  if(d.error){alert(d.error);return}
  const o=$("out");o.style.display="block";o.className=d.level;
  $("lvl").textContent=d.label;
  $("flags").innerHTML=d.flags.map(f=>`<div class="adv">${f.advice}</div>`).join("")||`<div class="adv">No clear match. Please see a doctor to be safe.</div>`;
  $("sum").textContent=d.summary;$("ref").href="/referral/"+d.id;
  o.scrollIntoView({behavior:"smooth"});loadStats();
};
async function loadStats(){
  const d=await (await fetch("/api/stats")).json();
  const L=d.levels,tot=(L.red||0)+(L.yellow||0)+(L.green||0);
  if(!tot){$("stats").innerHTML="";return}
  const w=k=>((L[k]||0)/tot*100)+"%";
  $("stats").innerHTML=`<strong>${tot} cases logged</strong><div class="bar"><span style="width:${w('red')};background:var(--r)"></span><span style="width:${w('yellow')};background:var(--y)"></span><span style="width:${w('green')};background:var(--g)"></span></div>
  Red ${L.red||0} · Yellow ${L.yellow||0} · Green ${L.green||0}<br>Top villages: ${d.villages.map(v=>v.village+" ("+v.n+")").join(", ")||"–"}`;
}
loadStats();
</script></body></html>
